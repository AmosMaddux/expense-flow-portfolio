[project]
name = "expense-flow-project-team-3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138.0",
    "pydantic>=2",
    "pyjwt[crypto]>=2.10.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["./tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
packages = ["backend", "tests"]
