services:
    postgres:
        # pgvector image, not stock postgres: policy retrieval stores chunk
        # embeddings in a vector column and the migrations create the extension.
        image: pgvector/pgvector:pg17
        environment:
            POSTGRES_DB: expenseflow_core_case
            POSTGRES_USER: expenseflow
            POSTGRES_PASSWORD: expenseflow_local_dev_only
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U expenseflow -d expenseflow_core_case",
                ]
            interval: 5s
            timeout: 3s
            retries: 12
        ports:
            - "55432:5432"

    postgres-e2e-marker:
        image: postgres:17-alpine
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PGDATABASE: expenseflow_core_case
            PGHOST: postgres
            PGPASSWORD: expenseflow_local_dev_only
            PGUSER: expenseflow
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >
                psql --set=ON_ERROR_STOP=1
                --command="COMMENT ON DATABASE expenseflow_core_case IS
                'expenseflow-core-case-deterministic-e2e-v1'"

    core-case-service:
        build:
            context: .
            dockerfile: backend/core-case-service/Dockerfile
        image: expenseflow-core-case:local
        depends_on:
            postgres:
                condition: service_healthy
            gl-coding:
                condition: service_healthy
            redis:
                condition: service_healthy
            dynamodb-init:
                condition: service_completed_successfully
            localstack:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >
                if [ "$${AWS_WALKTHROUGH_USE_REAL_AWS:-false}" = "true" ]; then
                unset AWS_ENDPOINT_URL
                AWS_ENDPOINT_URL_DYNAMODB
                AWS_ENDPOINT_URL_SNS
                AWS_ENDPOINT_URL_SQS
                DYNAMODB_ENDPOINT
                STAGE_TRANSITION_SNS_ENDPOINT
                STAGE_TRANSITION_SQS_ENDPOINT;
                if [ -n "$${AWS_PROFILE:-}" ] && [ "$${AWS_WALKTHROUGH_USE_EXPORTED_CREDENTIALS:-false}" != "true" ]; then
                unset AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY
                AWS_SESSION_TOKEN
                AWS_CREDENTIAL_EXPIRATION;
                fi;
                if [ -z "$${STAGE_TRANSITION_SNS_TOPIC_ARN:-}" ]; then
                echo "STAGE_TRANSITION_SNS_TOPIC_ARN is required for AWS walkthrough mode." >&2;
                exit 1;
                fi;
                else
                unset AWS_PROFILE
                AWS_SDK_LOAD_CONFIG
                AWS_SESSION_TOKEN
                AWS_CREDENTIAL_EXPIRATION;
                until export STAGE_TRANSITION_SNS_TOPIC_ARN="$$(node --input-type=module
                -e "import { CreateTopicCommand, SNSClient } from '@aws-sdk/client-sns';
                const client = new SNSClient({
                endpoint: process.env.STAGE_TRANSITION_SNS_ENDPOINT,
                region: process.env.AWS_REGION
                });
                const response = await client.send(new CreateTopicCommand({
                Name: 'expenseflow-stage-transitions-local'
                }));
                process.stdout.write(response.TopicArn ?? '');")" &&
                [ -n "$$STAGE_TRANSITION_SNS_TOPIC_ARN" ]; do
                echo "Local stage-transition topic identifier could not be resolved." >&2;
                sleep 2;
                done;
                export STAGE_TRANSITION_SNS_TOPIC_ARN;
                fi;
                node backend/core-case-service/dist/index.js
        environment:
            ARGON2_HASH_LENGTH: ${ARGON2_HASH_LENGTH:-32}
            ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-19456}
            ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
            ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
            AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
            AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-expenseflow-http-api}
            AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-expenseflow-core-case-service}
            AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-local-dev-rs256-v1}
            AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64:?AUTH_JWT_PRIVATE_KEY_BASE64 must be set in .env}
            AUTO_APPLY_MIGRATIONS: ${CORE_CASE_LOCAL_APPLY_MIGRATIONS:-true}
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-expenseflowlocal}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
            AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
            AWS_PROFILE: ${AWS_PROFILE:-}
            AWS_REGION: ${AWS_REGION:-us-east-1}
            AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-1}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-expenseflowlocaldevonly}
            AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
            AWS_WALKTHROUGH_USE_REAL_AWS: ${AWS_WALKTHROUGH_USE_REAL_AWS:-false}
            AWS_WALKTHROUGH_USE_EXPORTED_CREDENTIALS: ${AWS_WALKTHROUGH_USE_EXPORTED_CREDENTIALS:-false}
            CASE_QUEUE_ROLLUP_TTL_SECONDS: ${CASE_QUEUE_ROLLUP_TTL_SECONDS:-30}
            CORE_CASE_RATE_LIMIT_REQUESTS: ${CORE_CASE_RATE_LIMIT_REQUESTS:-100}
            CORE_CASE_RATE_LIMIT_WINDOW_SECONDS: ${CORE_CASE_RATE_LIMIT_WINDOW_SECONDS:-60}
            DATABASE_URL: postgres://expenseflow:expenseflow_local_dev_only@postgres:5432/expenseflow_core_case
            DYNAMODB_ENDPOINT: http://dynamodb:8000
            DYNAMODB_EXPENSE_REPORT_TABLE: ${DYNAMODB_EXPENSE_REPORT_TABLE:-expenseflow-expense-reports}
            DYNAMODB_EXPENSE_REPORT_TENANT_INDEX: ${DYNAMODB_EXPENSE_REPORT_TENANT_INDEX:-tenantId-index}
            GL_CODING_BASE_BACKOFF_MS: ${GL_CODING_BASE_BACKOFF_MS:-100}
            GL_CODING_MAX_BACKOFF_MS: ${GL_CODING_MAX_BACKOFF_MS:-1000}
            GL_CODING_MAX_RETRIES: ${GL_CODING_MAX_RETRIES:-2}
            GL_CODING_SERVICE_BASE_URL: http://gl-coding:8001
            GL_CODING_TIMEOUT_MS: ${GL_CODING_TIMEOUT_MS:-5000}
            MFA_TOTP_SECRET_ENCRYPTION_KEY: ${MFA_TOTP_SECRET_ENCRYPTION_KEY:?MFA_TOTP_SECRET_ENCRYPTION_KEY must be set in .env}
            MFA_TOTP_SECRET_KEY_VERSION: ${MFA_TOTP_SECRET_KEY_VERSION:-local-dev-v1}
            MILEAGE_REIMBURSEMENT_RATE: ${MILEAGE_REIMBURSEMENT_RATE:-0.70}
            NODE_ENV: development
            OpenAPIKey: ${OpenAPIKey:-}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            OPENAPIKEY: ${OPENAPIKEY:-}
            PORT: 3000
            POLICY_ASSIST_API_KEY: ${POLICY_ASSIST_API_KEY:-}
            POLICY_ASSIST_BASE_BACKOFF_MS: ${POLICY_ASSIST_BASE_BACKOFF_MS:-250}
            POLICY_ASSIST_BASE_URL: ${POLICY_ASSIST_BASE_URL:-https://api.openai.com/v1}
            POLICY_ASSIST_MAX_BACKOFF_MS: ${POLICY_ASSIST_MAX_BACKOFF_MS:-2000}
            POLICY_ASSIST_MAX_RETRIES: ${POLICY_ASSIST_MAX_RETRIES:-1}
            POLICY_ASSIST_MODEL: ${POLICY_ASSIST_MODEL:-gpt-4o-mini}
            POLICY_ASSIST_TIMEOUT_MS: ${POLICY_ASSIST_TIMEOUT_MS:-30000}
            RECEIPT_STORAGE_BUCKET: ${RECEIPT_STORAGE_BUCKET:-expenseflow-receipts-local}
            RECEIPT_STORAGE_ACCESS_KEY_ID: ${RECEIPT_STORAGE_ACCESS_KEY_ID:-expenseflow-local}
            RECEIPT_STORAGE_ENDPOINT: http://minio:9000
            RECEIPT_STORAGE_FORCE_PATH_STYLE: ${RECEIPT_STORAGE_FORCE_PATH_STYLE:-true}
            RECEIPT_STORAGE_SECRET_ACCESS_KEY: ${RECEIPT_STORAGE_SECRET_ACCESS_KEY:-expenseflow-local-dev-only}
            REDIS_URL: redis://redis:6379
            SPA_ORIGIN: ${SPA_ORIGIN:-http://127.0.0.1:5173}
            STAGE_TRANSITION_SNS_TOPIC_ARN: ${STAGE_TRANSITION_SNS_TOPIC_ARN:-}
            STAGE_TRANSITION_SNS_ENDPOINT: http://localstack:4566
            STAGE_TRANSITION_SQS_ENDPOINT: http://localstack:4566
            STAGE_TRANSITION_SQS_QUEUE_URL: ${STAGE_TRANSITION_SQS_QUEUE_URL:-http://localstack:4566/000000000000/expenseflow-stage-transition-events-local}
            TIN_EIN_VALIDATION_BREAKER_ERROR_THRESHOLD_PERCENTAGE: ${TIN_EIN_VALIDATION_BREAKER_ERROR_THRESHOLD_PERCENTAGE:-50}
            TIN_EIN_VALIDATION_BREAKER_RESET_TIMEOUT_MS: ${TIN_EIN_VALIDATION_BREAKER_RESET_TIMEOUT_MS:-30000}
            TIN_EIN_VALIDATION_ENDPOINT_URL: ${TIN_EIN_VALIDATION_ENDPOINT_URL:-https://tin-ein.example.test/tivs}
            TIN_EIN_VALIDATION_OPERATION_NAME: ${TIN_EIN_VALIDATION_OPERATION_NAME:-VerifyTaxpayer}
            TIN_EIN_VALIDATION_PASSWORD: ${TIN_EIN_VALIDATION_PASSWORD:-replace-with-tivs-password}
            TIN_EIN_VALIDATION_STATUS_ENRICHMENT_ENABLED: ${TIN_EIN_VALIDATION_STATUS_ENRICHMENT_ENABLED:-true}
            TIN_EIN_VALIDATION_STATUS_OPERATION_NAME: ${TIN_EIN_VALIDATION_STATUS_OPERATION_NAME:-GetTaxpayerStatus}
            TIN_EIN_VALIDATION_TIMEOUT_MS: ${TIN_EIN_VALIDATION_TIMEOUT_MS:-5000}
            TIN_EIN_VALIDATION_USERNAME: ${TIN_EIN_VALIDATION_USERNAME:-replace-with-tivs-username}
            TIN_EIN_VALIDATION_WSDL_URL: ${TIN_EIN_VALIDATION_WSDL_URL:-https://tin-ein.example.test/tivs?wsdl}
        ports:
            - "3301:3000"
        volumes:
            - ${HOME}/.aws:/home/node/.aws:ro

    gl-coding:
        build:
            context: .
            dockerfile: backend/python/Dockerfile
        image: expenseflow-gl-coding:local
        depends_on:
            postgres:
                condition: service_started
        environment:
            AUTH_JWT_CLOCK_SKEW_SECONDS: ${AUTH_JWT_CLOCK_SKEW_SECONDS:-10}
            AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-expenseflow-http-api}
            AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-expenseflow-core-case-service}
            AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-local-dev-rs256-v1}
            AUTH_JWT_JWKS_JSON: ${AUTH_JWT_JWKS_JSON:?AUTH_JWT_JWKS_JSON must be set in .env}
            DATABASE_URL: postgres://expenseflow:expenseflow_local_dev_only@postgres:5432/expenseflow_core_case
            MILEAGE_REIMBURSEMENT_RATE: ${MILEAGE_REIMBURSEMENT_RATE:-0.70}
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)",
                ]
            interval: 5s
            timeout: 3s
            retries: 12
        ports:
            - "8001:8001"

    gl-mapping-init:
        image: postgres:17-alpine
        depends_on:
            postgres:
                condition: service_started
        environment:
            PGDATABASE: expenseflow_core_case
            PGHOST: postgres
            PGPASSWORD: expenseflow_local_dev_only
            PGUSER: expenseflow
            VITE_TENANT_ID: ${VITE_TENANT_ID:-8e2bfbb1-9f72-4810-b8b1-a02a25cdd2fb}
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >
                until psql -tAc
                "SELECT to_regclass('public.gl_mapping') IS NOT NULL"
                | grep -q t;
                do sleep 2; done;
                psql
                --set=tenant_id="$$VITE_TENANT_ID"
                --file=/local-dev/seed-gl-mappings.sql
        volumes:
            - ./scripts/seed-local-gl-mappings.sql:/local-dev/seed-gl-mappings.sql:ro

    redis:
        image: redis:7-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 12
        ports:
            - "56379:6379"

    minio:
        image: minio/minio:latest
        command: ["server", "/data"]
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-expenseflowlocal}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-expenseflowlocaldevonly}
        ports:
            - "59000:9000"

    minio-init:
        image: minio/mc:latest
        depends_on:
            - minio
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >
                until mc alias set local http://minio:9000
                "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
                do sleep 1; done;
                mc mb --ignore-existing local/expenseflow-receipts-local;
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-expenseflowlocal}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-expenseflowlocaldevonly}

    dynamodb:
        image: amazon/dynamodb-local:latest
        command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
        ports:
            - "58000:8000"

    dynamodb-init:
        image: amazon/aws-cli:latest
        depends_on:
            - dynamodb
        environment:
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-expenseflowlocal}
            AWS_DEFAULT_REGION: us-east-1
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-expenseflowlocaldevonly}
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >
                until aws dynamodb list-tables
                --endpoint-url http://dynamodb:8000;
                do sleep 1; done;
                if ! aws dynamodb describe-table
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-idempotency-local >/dev/null 2>&1;
                then
                aws dynamodb create-table
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-idempotency-local
                --attribute-definitions AttributeName=pk,AttributeType=S
                --key-schema AttributeName=pk,KeyType=HASH
                --billing-mode PAY_PER_REQUEST;
                fi;
                aws dynamodb wait table-exists
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-idempotency-local;
                ttl_status="$$(aws dynamodb describe-time-to-live
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-idempotency-local
                --query TimeToLiveDescription.TimeToLiveStatus
                --output text 2>/dev/null || true)";
                if [ "$$ttl_status" != "ENABLED" ] &&
                [ "$$ttl_status" != "ENABLING" ];
                then
                aws dynamodb update-time-to-live
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-idempotency-local
                --time-to-live-specification Enabled=true,AttributeName=ttl;
                fi;
                if ! aws dynamodb describe-table
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-expense-reports >/dev/null 2>&1;
                then
                aws dynamodb create-table
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-expense-reports
                --attribute-definitions
                AttributeName=id,AttributeType=S
                AttributeName=tenantId,AttributeType=S
                --key-schema AttributeName=id,KeyType=HASH
                --global-secondary-indexes
                "IndexName=tenantId-index,KeySchema=[{AttributeName=tenantId,KeyType=HASH}],Projection={ProjectionType=ALL}"
                --billing-mode PAY_PER_REQUEST;
                fi;
                aws dynamodb wait table-exists
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-expense-reports

    localstack:
        image: localstack/localstack:4.8
        environment:
            AWS_DEFAULT_REGION: us-east-1
            SERVICES: sns,sqs
        healthcheck:
            test: ["CMD", "awslocal", "sns", "list-topics"]
            interval: 5s
            timeout: 3s
            retries: 12
        ports:
            - "${LOCALSTACK_PORT:-4566}:4566"
        volumes:
            - ./scripts/init-local-stage-transition-events.sh:/etc/localstack/init/ready.d/init-stage-transition-events.sh:ro
