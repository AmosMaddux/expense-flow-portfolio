services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: expenseflow_core_case
            POSTGRES_USER: expenseflow
            POSTGRES_PASSWORD: expenseflow_local_dev_only
        ports:
            - "55432:5432"

    redis:
        image: redis:7-alpine
        ports:
            - "56379:6379"

    dynamodb:
        image: amazon/dynamodb-local:latest
        command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
        ports:
            - "58000:8000"

    dynamodb-init:
        image: amazon/aws-cli:latest
        depends_on:
            - dynamodb
        environment:
            AWS_ACCESS_KEY_ID: expenseflow-local
            AWS_SECRET_ACCESS_KEY: expenseflow-local
            AWS_DEFAULT_REGION: us-east-1
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >
                until aws dynamodb list-tables --endpoint-url http://dynamodb:8000;
                do sleep 1; done;
                aws dynamodb create-table
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-idempotency-local
                --attribute-definitions AttributeName=pk,AttributeType=S
                --key-schema AttributeName=pk,KeyType=HASH
                --billing-mode PAY_PER_REQUEST
                || true;
                aws dynamodb update-time-to-live
                --endpoint-url http://dynamodb:8000
                --table-name expenseflow-idempotency-local
                --time-to-live-specification Enabled=true,AttributeName=ttl
                || true
