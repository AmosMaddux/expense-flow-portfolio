    <body
        class="bg-surface text-on-surface font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed"
    >
        <main
            class="min-h-screen flex items-center justify-center px-md relative overflow-hidden"
        >
            <!-- Background Subtle Pattern -->
            <div
                class="absolute inset-0 opacity-[0.03] pointer-events-none"
                style="
                    background-image: radial-gradient(
                        #475569 1px,
                        transparent 1px
                    );
                    background-size: 24px 24px;
                "
            ></div>
            <!-- MFA Challenge Card -->
            <div
                class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant p-xl shadow-sm rounded-lg relative z-10"
            >
                <!-- Brand Anchor - Identity -->
                <div class="flex flex-col items-center mb-lg">
                    <div
                        class="mb-md flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container-high border border-outline-variant"
                    >
                        <span
                            class="material-symbols-outlined text-primary text-[28px]"
                            data-icon="lock_open"
                            >lock_open</span
                        >
                    </div>
                    <h1
                        class="font-headline-md text-headline-md text-primary mb-xs"
                    >
                        ExpenseFlow
                    </h1>
                    <p
                        class="font-body-sm text-body-sm text-on-surface-variant"
                    >
                        Management System
                    </p>
                </div>
                <!-- Header Section -->
                <div class="text-center mb-xl">
                    <h2
                        class="font-headline-sm text-headline-sm text-on-surface mb-sm"
                    >
                        Verify your identity
                    </h2>
                    <p
                        class="font-body-md text-body-md text-on-surface-variant"
                    >
                        Enter the 6-digit code sent to your email
                    </p>
                </div>
                <!-- MFA Inputs -->
                <form class="space-y-xl" id="mfa-form">
                    <div
                        class="flex justify-between gap-sm"
                        id="digit-container"
                    >
                        <input
                            aria-label="Digit 1"
                            class="digit-input w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant bg-surface-container-low rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary transition-all"
                            maxlength="1"
                            pattern="\d*"
                            type="text"
                        />
                        <input
                            aria-label="Digit 2"
                            class="digit-input w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant bg-surface-container-low rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary transition-all"
                            maxlength="1"
                            pattern="\d*"
                            type="text"
                        />
                        <input
                            aria-label="Digit 3"
                            class="digit-input w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant bg-surface-container-low rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary transition-all"
                            maxlength="1"
                            pattern="\d*"
                            type="text"
                        />
                        <input
                            aria-label="Digit 4"
                            class="digit-input w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant bg-surface-container-low rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary transition-all"
                            maxlength="1"
                            pattern="\d*"
                            type="text"
                        />
                        <input
                            aria-label="Digit 5"
                            class="digit-input w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant bg-surface-container-low rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary transition-all"
                            maxlength="1"
                            pattern="\d*"
                            type="text"
                        />
                        <input
                            aria-label="Digit 6"
                            class="digit-input w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant bg-surface-container-low rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary transition-all"
                            maxlength="1"
                            pattern="\d*"
                            type="text"
                        />
                    </div>
                    <!-- Primary Action -->
                    <button
                        class="w-full h-12 bg-primary-container text-on-primary hover:opacity-90 active:scale-[0.98] transition-all font-headline-sm text-headline-sm rounded-lg flex items-center justify-center gap-sm shadow-sm"
                        type="submit"
                    >
                        Verify
                    </button>
                    <!-- Secondary Actions -->
                    <div
                        class="flex flex-col items-center gap-md pt-md border-t border-outline-variant"
                    >
                        <button
                            class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md flex items-center gap-xs"
                            type="button"
                        >
                            Didn't receive a code?

                                class="text-primary font-bold decoration-2 hover:underline"

        <!-- Micro-interactions Script -->
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const inputs = document.querySelectorAll(".digit-input");
                const form = document.getElementById("mfa-form");

                // Handle Input behavior (Auto-focus next, backspace)
                inputs.forEach((input, index) => {
                    input.addEventListener("input", (e) => {
                        if (e.inputType === "deleteContentBackward") return;

                        const value = e.target.value;
                        if (value && index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    });

                    input.addEventListener("keydown", (e) => {
                        if (
                            e.key === "Backspace" &&
                            !e.target.value &&
                            index > 0
                        ) {
                            inputs[index - 1].focus();
                        }
                    });

                    // Paste support
                    input.addEventListener("paste", (e) => {
                        e.preventDefault();
                        const pasteData = e.clipboardData
                            .getData("text")
                            .slice(0, 6)
                            .split("");
                        pasteData.forEach((char, i) => {
                            if (inputs[i] && /^\d$/.test(char)) {
                                inputs[i].value = char;
                            }
                        });
                        const nextFocus = Math.min(
                            pasteData.length,
                            inputs.length - 1,
                        );
                        inputs[nextFocus].focus();
                    });
                });

                // Button Loading State Simulation
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const btn = form.querySelector('button[type="submit"]');
                    const originalText = btn.innerHTML;

                    btn.disabled = true;
                    btn.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Verifying...
                `;

                    // Simulate API call
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                        // Actual implementation would redirect here
                    }, 1500);
                });
            });
        </script>
