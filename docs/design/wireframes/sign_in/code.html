<!doctype html>
<html lang="en" class="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <script id="tailwind-config">
            try {
                tailwind.config = {
                    darkMode: "class",
                    theme: {
                        extend: {
                            colors: {
                                primary: "#303e51",
                                "on-primary": "#ffffff",
                                "surface-tint": "#515f74",
                                "on-error": "#ffffff",
                                "tertiary-container": "#774a00",
                                "surface-variant": "#e0e3e5",
                                "secondary-fixed": "#6ffbbe",
                                "surface-container-low": "#f2f4f6",
                                "on-primary-container": "#bbcae1",
                                "error-container": "#ffdad6",
                                "inverse-on-surface": "#eff1f3",
                                "inverse-surface": "#2d3133",
                                tertiary: "#583500",
                                "surface-container-highest": "#e0e3e5",
                                "on-tertiary-fixed": "#2a1700",
                                "on-secondary-fixed": "#002113",
                                background: "#f7f9fb",
                                "tertiary-fixed": "#ffddb8",
                                "inverse-primary": "#b9c7df",
                                "tertiary-fixed-dim": "#ffb95f",
                                "primary-fixed": "#d5e3fc",
                                "on-primary-fixed-variant": "#3a485b",
                                "secondary-container": "#6cf8bb",
                                "outline-variant": "#c4c6cd",
                                "on-secondary-container": "#00714d",
                                "secondary-fixed-dim": "#4edea3",
                                "surface-container-lowest": "#ffffff",
                                "surface-container": "#eceef0",
                                "on-tertiary-container": "#ffbb66",
                                "surface-dim": "#d8dadc",
                                "on-surface-variant": "#44474c",
                                "primary-fixed-dim": "#b9c7df",
                                "surface-bright": "#f7f9fb",
                                "on-primary-fixed": "#0d1c2e",
                                secondary: "#006c49",
                                "on-surface": "#191c1e",
                                "on-error-container": "#93000a",
                                "on-secondary": "#ffffff",
                                "primary-container": "#475569",
                                "on-background": "#191c1e",
                                "surface-container-high": "#e6e8ea",
                                "on-secondary-fixed-variant": "#005236",
                                surface: "#f7f9fb",
                                outline: "#75777d",
                                "on-tertiary": "#ffffff",
                                "on-tertiary-fixed-variant": "#653e00",
                                error: "#ba1a1a",
                            },
                            borderRadius: {
                                DEFAULT: "0.125rem",
                                lg: "0.25rem",
                                xl: "0.5rem",
                                full: "0.75rem",
                            },
                            fontFamily: {
                                "label-sm": ["JetBrains Mono"],
                                "label-md": ["JetBrains Mono"],
                                "headline-sm": ["Inter"],
                                "headline-lg": ["Inter"],
                                "body-sm": ["Inter"],
                                "body-md": ["Inter"],
                                "headline-md": ["Inter"],
                                "body-lg": ["Inter"],
                            },
                            fontSize: {
                                "label-sm": [
                                    "10px",
                                    { lineHeight: "12px", fontWeight: "500" },
                                ],
                                "label-md": [
                                    "12px",
                                    {
                                        lineHeight: "16px",
                                        letterSpacing: "0.02em",
                                        fontWeight: "500",
                                    },
                                ],
                                "headline-sm": [
                                    "16px",
                                    { lineHeight: "24px", fontWeight: "600" },
                                ],
                                "headline-lg": [
                                    "24px",
                                    {
                                        lineHeight: "32px",
                                        letterSpacing: "-0.02em",
                                        fontWeight: "600",
                                    },
                                ],
                                "body-sm": [
                                    "12px",
                                    { lineHeight: "16px", fontWeight: "400" },
                                ],
                                "body-md": [
                                    "14px",
                                    { lineHeight: "20px", fontWeight: "400" },
                                ],
                                "headline-md": [
                                    "20px",
                                    {
                                        lineHeight: "28px",
                                        letterSpacing: "-0.01em",
                                        fontWeight: "600",
                                    },
                                ],
                                "body-lg": [
                                    "16px",
                                    { lineHeight: "24px", fontWeight: "400" },
                                ],
                            },
                        },
                    },
                };
            } catch (_e) {}
        </script>
    </head>
    <body class="bg-pattern min-h-screen flex items-center justify-center p-md">
        <!-- Atmospheric Background Decoration -->
        <div class="fixed inset-0 pointer-events-none overflow-hidden">
            <div
                class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"
            ></div>
            <div
                class="absolute -bottom-[10%] -right-[10%] w-[30%] h-[30%] bg-secondary/5 rounded-full blur-[100px]"
            ></div>
        </div>

        <!-- Main Auth Container -->
        <main class="relative w-full max-w-[440px] z-10">
            <!-- Brand Header Section -->
            <div class="flex flex-col items-center mb-xl text-center">
                <div
                    class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-md"
                >
                    <span
                        class="material-symbols-outlined text-on-primary text-[32px]"
                        >payments</span
                    >
                </div>
                <h1
                    class="font-headline-lg text-headline-lg text-on-surface tracking-tight"
                >
                    ExpenseFlow
                </h1>
                <p
                    class="font-label-md text-label-md text-on-surface-variant mt-xs uppercase tracking-widest"
                >
                    Enterprise Management System
                </p>
            </div>

            <!-- Login Card -->
            <div
                class="bg-surface-container-lowest border border-outline-variant rounded-lg p-xl login-card-shadow"
            >
                <form
                    id="loginForm"
                    class="space-y-lg"
                    onsubmit="event.preventDefault()"
                >
                    <!-- Email Field -->
                    <div class="space-y-sm">
                        <label
                            for="email"
                            class="block font-label-md text-label-md text-on-surface-variant"
                            >Email</label
                        >
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]"
                                >mail</span
                            >
                            <input
                                type="email"
                                id="email"
                                placeholder="user-a@example.test"
                                class="w-full pl-10 pr-md py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline"
                                required=""
                            />
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="space-y-sm">
                        <div class="flex justify-between items-center">
                            <label
                                for="password"
                                class="block font-label-md text-label-md text-on-surface-variant"
                                >Password</label
                            >
                            <a
                                href="#"
                                class="font-label-md text-label-md text-primary hover:underline transition-all"
                                >Forgot Password?</a
                            >
                        </div>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]"
                                >lock</span
                            >
                            <input
                                type="password"
                                id="password"
                                placeholder="••••••••"
                                class="w-full pl-10 pr-12 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline"
                                required=""
                            />
                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-outline hover:text-on-surface-variant transition-colors"
                            >
                                <span
                                    class="material-symbols-outlined text-[20px]"
                                    id="passwordIcon"
                                    >visibility</span
                                >
                            </button>
                        </div>
                    </div>

                    <!-- Stay Signed In & IT Contact -->
                    <div class="flex items-center space-x-sm">
                        <div class="relative flex items-center">
                            <input
                                type="checkbox"
                                id="remember"
                                class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary focus:ring-offset-0 cursor-pointer"
                            />
                        </div>
                        <label
                            for="remember"
                            class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none"
                        >
                            Stay signed in for 30 days
                        </label>
                    </div>

                    <!-- Sign In Button -->
                    <button
                        type="submit"
                        class="w-full py-3.5 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-lg hover:bg-primary-container hover:shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm group"
                    >
                        Sign In
                        <span
                            class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform"
                            >arrow_forward</span
                        >
                    </button>
                </form>

                <!-- Footer Link -->
                <div
                    class="mt-xl pt-lg border-t border-outline-variant text-center"
                >
                    <p
                        class="font-body-sm text-body-sm text-on-surface-variant"
                    >
                        Don't have an account?
                        <a
                            href="#"
                            class="text-primary font-bold hover:underline"
                            >Contact IT</a
                        >
                    </p>
                </div>
            </div>

            <!-- Security & Trust Badges -->
            <div
                class="mt-lg flex justify-center items-center gap-xl opacity-60"
            >
                <div class="flex items-center gap-xs grayscale">
                    <span class="material-symbols-outlined text-[16px]"
                        >shield_lock</span
                    >
                    <span class="font-label-sm text-label-sm"
                        >AES-256 ENCRYPTED</span
                    >
                </div>
            </div>
        </main>

        <!-- Micro-interactions Script -->
        <script class="">
            // Password Visibility Toggle Logic
            const togglePassword = document.querySelector('#togglePassword');
            const passwordInput = document.querySelector('#password');
            const passwordIcon = document.querySelector('#passwordIcon');

            togglePassword.addEventListener('click', function (e) {
                // Toggle the type attribute
        </script>
    </body>
</html>
