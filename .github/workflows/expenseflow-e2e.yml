name: ExpenseFlow E2E

on:
    pull_request:
    push:
        branches:
            - development
            - main

jobs:
    playwright-happy-path:
        name: Playwright happy path
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Set up uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Install Node dependencies
              run: npm ci

            - name: Install Python dependencies
              run: uv sync

            - name: Create synthetic local JWT keys
              run: ./scripts/generate-dev-jwt-keys.sh

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run ExpenseFlow happy-path E2E
              run: npm run test:e2e

            - name: Collect service logs
              if: failure()
              run: |
                  mkdir -p test-results
                  docker compose logs --no-color postgres redis gl-coding > test-results/docker-compose-e2e.log 2>&1 || true

            - name: Upload Playwright failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: expenseflow-playwright-artifacts
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Stop E2E services
              if: always()
              run: docker compose down --volumes --remove-orphans
