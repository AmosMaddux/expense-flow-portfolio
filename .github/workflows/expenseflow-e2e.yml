name: ExpenseFlow E2E

on:
    pull_request:
    push:
        branches:
            - development
            - main

jobs:
    ui-quality-gate:
        name: UI quality gate
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 35

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Set up uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Install Node dependencies
              run: npm ci

            - name: Install Python dependencies
              run: uv sync

            - name: Create synthetic local JWT keys
              run: ./scripts/generate-dev-jwt-keys.sh

            - name: Smoke test Core Case container image
              run: npm run test:container:core-case

            - name: Smoke test packaged GL-coding image
              run: ./scripts/smoke-test-gl-coding-image.sh .env

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run ExpenseFlow UI quality gate
              run: npm run test:ui-gate

            - name: Run stage-transition DLQ redrive test
              env:
                  AWS_REGION: us-east-1
                  AWS_ACCESS_KEY_ID: expenseflow-local
                  AWS_SECRET_ACCESS_KEY: expenseflow-local-dev-only
                  EXPENSE_FLOW_RUN_LOCALSTACK_TESTS: "1"
                  STAGE_TRANSITION_SQS_ENDPOINT: http://127.0.0.1:4566
              run: >
                  npx vitest run --project integration
                  backend/core-case-service/src/events/stageTransitionSqsConsumer.integration.test.ts

            - name: Collect service logs
              if: failure()
              run: |
                  mkdir -p test-results
                  docker compose logs --no-color postgres redis gl-coding dynamodb minio localstack dynamodb-init minio-init postgres-e2e-marker > test-results/docker-compose-e2e.log 2>&1 || true

            - name: Upload UI gate failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: expenseflow-ui-gate-artifacts
                  path: |
                      playwright-report/
                      test-results/
                      .lighthouseci/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Stop E2E services
              if: always()
              run: docker compose down --volumes --remove-orphans
